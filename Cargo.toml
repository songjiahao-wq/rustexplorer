[package]
name = "rustexplorer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
arboard = "=3.4.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Com",
    # 系统剪贴板（CF_HDROP 文件复制/剪切/粘贴）
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }

[profile.release]
lto = true
strip = true
opt-level = "s"
